# Oracle Flyway migrate (TASK-004)
#
# H2-only green is not schema acceptance. Exact Oracle 19c patch/RU is still a
# DBA fill-in; this job uses Oracle XE as the allowed test-container substitute
# until that RU is pinned (ADR-0005).
name: flyway-oracle

on:
  pull_request:
  push:
    branches: [main]

jobs:
  migrate:
    runs-on: ubuntu-latest
    services:
      oracle:
        image: gvenzl/oracle-xe:21.3.0-slim-faststart
        env:
          ORACLE_PASSWORD: oracle
          APP_USER: atlas
          APP_USER_PASSWORD: atlas
        ports:
          - 1521:1521
        options: >-
          --health-cmd "healthcheck.sh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 40
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Flyway migrate against Oracle
        env:
          ATLAS_DATASOURCE_URL: jdbc:oracle:thin:@//localhost:1521/XEPDB1
          ATLAS_DATASOURCE_USERNAME: atlas
          ATLAS_DATASOURCE_PASSWORD: atlas
        run: ./scripts/flyway-migrate-oracle.sh

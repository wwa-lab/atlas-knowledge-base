# ADR-0005: local plane is H2. Oracle MODE reduces dialect surprises before Flyway (TASK-004).
spring:
  datasource:
    url: jdbc:h2:mem:atlas;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

atlas:
  secrets:
    file-root: ${user.dir}/.local-data/secrets
  session:
    # __Host- cookies require Secure HTTPS; local HTTP cannot set them.
    cookie-name: Atlas-Session
    cookie-secure: false
    cookie-same-site: Strict
    # Placeholders until Security approves idle/absolute TTL (OQ-01).
    idle-ttl: 8h
    absolute-ttl: 24h
  providers:
    # Placeholders until OQ-02 / Security names minimum GitHub and Confluence scopes.
    stub-completes-as-connected: true
